name: Refresh profile visuals
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate verified public snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public profile visuals"
            git push
          fi
