<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="152" height="46" viewBox="0 0 152 46" role="img" aria-labelledby="title desc">
<title id="title">Instagram link button</title>
<desc id="desc">Scalable dark navy social-link button with a subtle glowing rim, multicolor Instagram camera icon, and Instagram label.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10192B"/><stop offset="0.6" stop-color="#0E1626"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0F4FF"/><stop offset="0.36" stop-color="#94ABDB"/><stop offset="0.64" stop-color="#B1C5F2"/><stop offset="1" stop-color="#E7F2FF"/></linearGradient>
  <linearGradient id="labelFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9D1FF"/><stop offset="1" stop-color="#B4B7F5"/></linearGradient>
  <linearGradient id="instagramColor" x1="1" y1="23" x2="23" y2="1" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FEDA77"/><stop offset="0.25" stop-color="#F58529"/><stop offset="0.52" stop-color="#DD2A7B"/><stop offset="0.8" stop-color="#8134AF"/><stop offset="1" stop-color="#515BD4"/></linearGradient>
  <filter id="halo" x="-15%" y="-40%" width="130%" height="180%"><feGaussianBlur stdDeviation="1.5"/></filter>
</defs>
<rect x="2.1" y="2.1" width="147.8" height="41.8" rx="7.2" fill="none" stroke="#9CC1FA" stroke-width="1.75" opacity="0.36" filter="url(#halo)"/>
<rect x="2.6" y="2.6" width="146.8" height="40.8" rx="7.1" fill="url(#surface)" stroke="url(#rim)" stroke-width="1.12"/>
<path d="M11.2 4.1 H140" stroke="#B5D2FF" stroke-opacity="0.32" stroke-width="0.5"/>
<!-- Entire icon is editable vector geometry, not a bitmap. -->
<g transform="translate(12 11)">
  <rect x="1.2" y="1.2" width="21.6" height="21.6" rx="6.5" fill="none" stroke="url(#instagramColor)" stroke-width="2.5"/>
  <circle cx="12" cy="12" r="5.15" fill="none" stroke="url(#instagramColor)" stroke-width="2.5"/>
  <circle cx="18.05" cy="5.95" r="1.65" fill="url(#instagramColor)"/>
</g>
<text x="42.0" y="27.3" fill="url(#labelFill)" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.3" font-weight="650" letter-spacing="-0.12">Instagram</text>
</svg>
